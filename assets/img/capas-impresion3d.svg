<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <rect width="760" height="330" fill="#ffffff" rx="12"/>
  <text x="380" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">Cómo imprime una impresora 3D (tecnología FDM)</text>

  <circle cx="110" cy="90" r="34" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
  <circle cx="110" cy="90" r="10" fill="#94a3b8"/>
  <text x="110" y="148" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">filamento (PLA)</text>
  <path d="M 138 105 Q 220 120 300 140" fill="none" stroke="#8b5cf6" stroke-width="4"/>

  <rect x="230" y="46" width="300" height="210" rx="8" fill="none" stroke="#94a3b8" stroke-width="3"/>

  <polygon points="300,140 340,140 320,172" fill="#475569"/>
  <text x="320" y="196" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">boquilla ≈ 200 °C</text>
  <path d="M 320 176 q -8 8 0 16 M 320 176 q 8 8 0 16" fill="none" stroke="#dc2626" stroke-width="2.5"/>

  <rect x="270" y="242" width="230" height="12" rx="2" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <text x="385" y="274" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">cama ≈ 60 °C</text>

  <rect x="330" y="230" width="100" height="12" fill="#34d399" stroke="#047857" stroke-width="1.5"/>
  <rect x="330" y="218" width="100" height="12" fill="#10b981" stroke="#047857" stroke-width="1.5"/>
  <rect x="330" y="206" width="80" height="12" fill="#059669" stroke="#047857" stroke-width="1.5"/>
  <line x1="436" y1="218" x2="470" y2="196" stroke="#64748b" stroke-width="1.5"/>
  <text x="476" y="192" font-size="11.5" font-weight="700" fill="#047857">capas (≈ 0,2 mm)</text>
  <text x="476" y="208" font-size="10.5" fill="#64748b">una encima de otra</text>

  <rect x="580" y="70" width="160" height="150" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="660" y="96" text-anchor="middle" font-size="12.5" font-weight="700" fill="#047857">Paso a paso</text>
  <text x="596" y="122" font-size="11" fill="#334155">1. El filamento entra</text>
  <text x="596" y="142" font-size="11" fill="#334155">2. La boquilla lo funde</text>
  <text x="596" y="162" font-size="11" fill="#334155">3. Se deposita sobre</text>
  <text x="604" y="178" font-size="11" fill="#334155">   la capa anterior</text>
  <text x="596" y="198" font-size="11" fill="#334155">4. Se repite hasta</text>
  <text x="604" y="214" font-size="11" fill="#334155">   terminar la pieza</text>

  <text x="380" y="310" text-anchor="middle" font-size="12" fill="#64748b">La pieza no se talla ni se corta: se fabrica añadiendo material, capa a capa (fabricación aditiva)</text>
</svg>
