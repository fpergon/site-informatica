<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <rect width="880" height="420" fill="#ffffff" rx="12"/>
  <text x="440" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#047857">Unidades funcionales de un ordenador y buses</text>

  <rect x="30" y="90" width="220" height="240" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2.5"/>
  <text x="140" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">CPU</text>
  <rect x="55" y="130" width="170" height="60" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="140" y="156" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f46">UC</text>
  <text x="140" y="174" text-anchor="middle" font-size="10.5" fill="#334155">Unidad de Control</text>
  <rect x="55" y="210" width="170" height="60" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="140" y="236" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f46">ULA</text>
  <text x="140" y="254" text-anchor="middle" font-size="10.5" fill="#334155">Unidad Lógico-Aritmética</text>
  <text x="140" y="300" text-anchor="middle" font-size="10.5" fill="#64748b">La UC da las órdenes;</text>
  <text x="140" y="316" text-anchor="middle" font-size="10.5" fill="#64748b">la ULA calcula.</text>

  <rect x="600" y="70" width="250" height="110" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2.5"/>
  <text x="725" y="96" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4338ca">Memorias</text>
  <text x="725" y="122" text-anchor="middle" font-size="11.5" fill="#334155">Principal: RAM (volátil, de trabajo)</text>
  <text x="725" y="142" text-anchor="middle" font-size="11.5" fill="#334155">Secundaria: SSD / HDD (permanente)</text>
  <text x="725" y="162" text-anchor="middle" font-size="11.5" fill="#334155">Arranque: ROM / UEFI</text>

  <rect x="600" y="260" width="250" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5"/>
  <text x="725" y="286" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">Entrada / Salida (E/S)</text>
  <text x="725" y="312" text-anchor="middle" font-size="11.5" fill="#334155">Entrada: teclado, ratón, red</text>
  <text x="725" y="332" text-anchor="middle" font-size="11.5" fill="#334155">Salida: monitor, altavoces</text>
  <text x="725" y="352" text-anchor="middle" font-size="11.5" fill="#334155">Ambas: USB, pantalla táctil</text>

  <line x1="250" y1="175" x2="540" y2="175" stroke="#059669" stroke-width="5"/>
  <polygon points="540,175 528,168 528,182" fill="#059669"/>
  <polygon points="250,175 262,168 262,182" fill="#059669"/>
  <text x="395" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">Bus de datos</text>

  <line x1="250" y1="215" x2="540" y2="215" stroke="#4f46e5" stroke-width="5"/>
  <polygon points="540,215 528,208 528,222" fill="#4f46e5"/>
  <text x="395" y="206" text-anchor="middle" font-size="12" font-weight="700" fill="#4338ca">Bus de direcciones</text>

  <line x1="250" y1="255" x2="540" y2="255" stroke="#d97706" stroke-width="5"/>
  <polygon points="540,255 528,248 528,262" fill="#d97706"/>
  <text x="395" y="246" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">Bus de control</text>

  <line x1="540" y1="175" x2="540" y2="255" stroke="#64748b" stroke-width="2.5"/>
  <circle cx="540" cy="175" r="5" fill="#334155"/>
  <circle cx="540" cy="215" r="5" fill="#334155"/>
  <circle cx="540" cy="255" r="5" fill="#334155"/>
  <line x1="540" y1="215" x2="600" y2="215" stroke="#64748b" stroke-width="2.5"/>
  <line x1="570" y1="215" x2="570" y2="125" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="570,125 563,137 577,137" fill="#64748b"/>
  <line x1="570" y1="215" x2="570" y2="315" stroke="#64748b" stroke-width="2.5"/>
  <polygon points="570,315 563,303 577,303" fill="#64748b"/>
  <line x1="570" y1="125" x2="600" y2="125" stroke="#64748b" stroke-width="2.5"/>
  <line x1="570" y1="315" x2="600" y2="315" stroke="#64748b" stroke-width="2.5"/>
  <circle cx="570" cy="215" r="4" fill="#334155"/>

  <rect x="30" y="370" width="820" height="34" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="440" y="392" text-anchor="middle" font-size="12" font-weight="600" fill="#047857">Los buses son autopistas de información: datos (ida y vuelta), direcciones (dónde) y control (órdenes de lectura, escritura e interrupción)</text>
</svg>
