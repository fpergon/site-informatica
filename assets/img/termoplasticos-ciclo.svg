<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <rect width="760" height="300" fill="#ffffff" rx="12"/>

  <text x="20" y="34" font-size="15" font-weight="700" fill="#047857">Termoplásticos (se reciclan muchas veces)</text>
  <rect x="30" y="60" width="120" height="48" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="90" y="89" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">Sólido</text>
  <line x1="152" y1="74" x2="232" y2="74" stroke="#059669" stroke-width="3.5"/>
  <polygon points="232,74 220,67 220,81" fill="#059669"/>
  <text x="192" y="62" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">calor</text>
  <rect x="236" y="60" width="130" height="48" rx="8" fill="#a7f3d0" stroke="#059669" stroke-width="2"/>
  <text x="301" y="80" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f46">Líquido o blando</text>
  <text x="301" y="96" text-anchor="middle" font-size="10.5" fill="#334155">(se puede moldear)</text>
  <line x1="232" y1="102" x2="152" y2="102" stroke="#059669" stroke-width="3.5"/>
  <polygon points="152,102 164,95 164,109" fill="#059669"/>
  <text x="192" y="122" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">frío</text>
  <text x="200" y="150" text-anchor="middle" font-size="12.5" fill="#334155">Se puede repetir el ciclo muchas veces: fundir → moldear → enfriar</text>
  <rect x="60" y="166" width="280" height="34" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="200" y="188" text-anchor="middle" font-size="12.5" font-weight="700" fill="#047857">Ejemplos: PET, polietileno, PVC, PLA</text>
  <text x="200" y="228" text-anchor="middle" font-size="12" fill="#64748b">Botella, bolsa, tubería, filamento de la impresora</text>

  <line x1="390" y1="30" x2="390" y2="250" stroke="#e2e8f0" stroke-width="2"/>

  <text x="410" y="34" font-size="15" font-weight="700" fill="#b45309">Termoestables (no se reciclan fundiendo)</text>
  <rect x="420" y="60" width="120" height="48" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="480" y="89" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Sólido</text>
  <line x1="542" y1="74" x2="622" y2="74" stroke="#d97706" stroke-width="3.5"/>
  <polygon points="622,74 610,67 610,81" fill="#d97706"/>
  <text x="582" y="62" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">calor</text>
  <rect x="626" y="60" width="110" height="48" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <text x="681" y="80" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">Deformado</text>
  <text x="681" y="96" text-anchor="middle" font-size="10.5" fill="#334155">(no vuelve)</text>
  <text x="540" y="140" text-anchor="middle" font-size="12.5" fill="#334155">Al curar una sola vez quedan duros para siempre</text>
  <text x="540" y="162" text-anchor="middle" font-size="22" fill="#dc2626">✗</text>
  <text x="540" y="184" text-anchor="middle" font-size="11.5" font-weight="600" fill="#dc2626">No se funden otra vez → no se reciclan fundiendo</text>
  <rect x="440" y="196" width="280" height="34" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="580" y="218" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b45309">Ejemplos: casco, melamina, epoxi</text>
  <text x="580" y="258" text-anchor="middle" font-size="12" fill="#64748b">Aguantan el calor: no se derriten</text>
</svg>
